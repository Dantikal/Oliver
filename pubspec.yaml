name: oliver
description: "Oliver — маркетплейс объявлений для Кыргызстана."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state / navigation / network
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0

  # storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # media
  image_picker: ^1.1.2
  video_player: ^2.9.2
  cached_network_image: ^3.4.1

  # push: firebase_core ^3.8.0 + firebase_messaging ^15.1.5 — временно отключены (медленный GitHub),
  # вернуть вместе с кодом в lib/core/push/push_service.dart

  # ui
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0
  emoji_picker_flutter: ^4.3.0
  share_plus: ^10.1.2
  intl: any
  flutter_staggered_grid_view: ^0.7.0
  audioplayers: ^6.8.1
  record: ^7.1.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
