services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/oliver
      DATABASE_USER: oliver
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-oliver}
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/oliver}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-oliver}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-oliver-local-password}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      RESET_URL: ${RESET_URL:-http://localhost:3000/reset-password}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oliver
      POSTGRES_USER: oliver
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-oliver}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oliver -d oliver"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-oliver}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-oliver-local-password}
    ports: ["9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-oliver}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-oliver-local-password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done
        mc mb --ignore-existing local/oliver
        mc anonymous set download local/oliver
  mailpit:
    image: axllent/mailpit:v1.24.2
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
