server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/oliver}
    username: ${DATABASE_USER:oliver}
    password: ${DATABASE_PASSWORD:oliver}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  jwt-secret: ${JWT_SECRET}
  access-ttl-seconds: 900
  refresh-ttl-seconds: 2592000
  mail-from: ${MAIL_FROM:noreply@oliver.kg}
  reset-url: ${RESET_URL:http://localhost:3000/reset-password}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-url: ${S3_PUBLIC_URL:http://localhost:9000/oliver}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:oliver}
    access-key: ${S3_ACCESS_KEY:oliver}
    secret-key: ${S3_SECRET_KEY:oliver-local-password}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
